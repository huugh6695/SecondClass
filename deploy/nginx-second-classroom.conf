# 第二课堂学时答疑工单系统 —— Nginx 站点配置
#
# 作用：把外网的 80/443 转到本机 8080 上的 Java 服务。
# 为什么不直接让 Java 听 80：① 1024 以下端口要 root；② 我们没做 HTTPS，
# 而 Nginx + certbot 一行命令就能拿到免费证书；③ 静态/限流/日志都交给 Nginx 更省事。
#
# 安装（详见 DEPLOY.md §10）：
#   sudo cp nginx-second-classroom.conf /etc/nginx/sites-available/second-classroom
#   sudo ln -s /etc/nginx/sites-available/second-classroom /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default        # 去掉 Nginx 自带的默认站点
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ 下面 server_name 里的 YOUR_DOMAIN 记得换成你的域名（还没域名就先填服务器公网 IP）。

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # 🔴🔴 这行不能省！！ 
    #   Nginx 默认 client_max_body_size 是 1MB，而本应用允许单文件 5MB、
    #   整个 multipart 请求 6MB（见 application-prod.yml 的 spring.servlet.multipart）。
    #   不开这个，用户传一张 3MB 的照片会被 Nginx **直接挡掉**并返回 413，
    #   请求压根到不了 Spring —— 应用日志里一片空白，你会以为是"上传功能没写对"。
    client_max_body_size 10m;

    # 访问日志：用来对着审计日志的时间线排查
    access_log /var/log/nginx/second-classroom.access.log;
    error_log  /var/log/nginx/second-classroom.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;

        # 🔴 审计日志里的"客户端 IP"就靠这两个头。
        #    util/WebUtil.getClientIp() 的读取顺序是：
        #      X-Forwarded-For 首个 → X-Real-IP → Proxy-Client-IP → WL-Proxy-Client-IP → remoteAddr
        #    这里故意**覆盖**（$remote_addr）而不是 append（$proxy_add_x_forwarded_for）：
        #    因为客户端可以自己伪造一个 X-Forwarded-For 发过来，
        #    append 会把伪造值留在最前面，被 WebUtil 当成真实 IP 记进审计表。
        #    覆盖之后，审计表里的 IP 一定是"真正连上 Nginx 的那个地址"。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP       $remote_addr;

        proxy_set_header Connection "";

        # Excel 导出（#47）、大列表查询可能超过 Nginx 默认的 60 秒
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;

        # 后端重启的那几秒，先别把 502 直接甩给用户
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # 健康检查不进访问日志，免得监控把日志刷满（可选，觉得没必要就删掉）
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
}
